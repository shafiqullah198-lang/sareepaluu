{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Saree by Paalu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fae8ff 100%);
            min-height: 100vh;
        }

        .playfair {
            font-family: 'Playfair Display', serif;
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.15) 100%);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1.5px solid rgba(248, 200, 220, 0.8);
            border-radius: 28px;
            box-shadow:
                0 25px 50px -15px rgba(183, 110, 121, 0.3),
                0 0 30px rgba(248, 200, 220, 0.3),
                inset 0 1px 2px rgba(255, 255, 255, 0.9),
                inset 0 -2px 8px rgba(183, 110, 121, 0.12);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(248, 200, 220, 0.5);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.55);
            border-color: rgba(183, 110, 121, 0.8);
            box-shadow: 0 0 20px rgba(248, 200, 220, 0.25);
        }

        .btn-premium {
            background: linear-gradient(135deg, #B76E79 0%, #d4a5a5 100%);
            box-shadow: 0 10px 25px rgba(183, 110, 121, 0.25);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (max-width: 767px) {
            html,
            body {
                max-width: 100%;
                overflow-x: hidden;
            }

            main {
                padding: 1rem !important;
            }

            section.glass-card {
                max-width: 100%;
                padding: 1.5rem !important;
                border-radius: 22px;
            }

            h1 {
                font-size: 1.35rem !important;
                line-height: 1.7rem !important;
            }

            h2 {
                font-size: 1.75rem !important;
                line-height: 2.15rem !important;
            }

            input,
            button {
                max-width: 100%;
            }
        }
    </style>
</head>

<body class="antialiased text-slate-800">
    <main class="min-h-screen flex items-center justify-center p-6">
        <section class="glass-card w-full max-w-md p-8 relative overflow-hidden">
            <div class="flex items-center gap-4 mb-8">
                <div class="w-14 h-14 glass-card flex items-center justify-center overflow-hidden shrink-0">
                    <img src="{% static 'images/sbp_logo.png' %}" alt="SBP" class="w-full h-full object-contain scale-[1.6]">
                </div>
                <div>
                    <h1 class="playfair text-2xl font-extrabold tracking-tight">Saree by Paalu</h1>
                    <p class="text-[10px] uppercase tracking-[0.2em] text-[#B76E79] font-bold">Premium Collection</p>
                </div>
            </div>

            <h2 class="playfair text-3xl font-bold mb-1">Welcome Back</h2>
            <p class="text-sm text-slate-500 mb-8">Use your Django admin-created account to continue.</p>

            <form id="loginForm" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" id="nextUrl" value="{{ next_url }}">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Username</label>
                    <input id="username" class="glass-input w-full px-4 py-3 text-sm font-semibold text-slate-700" autocomplete="username" required>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Password</label>
                    <input id="password" type="password" class="glass-input w-full px-4 py-3 text-sm font-semibold text-slate-700" autocomplete="current-password" required>
                </div>
                <label class="flex items-center gap-3 text-xs font-semibold text-slate-500">
                    <input id="remember" type="checkbox" checked class="rounded text-[#B76E79]">
                    Remember login on this device
                </label>
                <p id="error" class="hidden text-xs font-bold text-red-500"></p>
                <button type="submit" class="btn-premium w-full py-4 rounded-2xl text-xs font-bold text-white uppercase tracking-widest flex items-center justify-center gap-2">
                    <span id="buttonText">Login</span>
                    <span id="spinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                </button>
            </form>
        </section>
    </main>

    <script>
        lucide.createIcons();
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const error = document.getElementById('error');
            const spinner = document.getElementById('spinner');
            const buttonText = document.getElementById('buttonText');
            error.classList.add('hidden');
            spinner.classList.remove('hidden');
            buttonText.textContent = 'Authenticating';
            try {
                const response = await fetch('/api/v1/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error('Invalid username or password.');
                const storage = document.getElementById('remember').checked ? localStorage : sessionStorage;
                storage.setItem('access_token', data.access);
                storage.setItem('refresh_token', data.refresh);
                window.location.href = document.getElementById('nextUrl').value || '/';
            } catch (e) {
                error.textContent = e.message;
                error.classList.remove('hidden');
            } finally {
                spinner.classList.add('hidden');
                buttonText.textContent = 'Login';
            }
        });
    </script>
</body>

</html>
